<!--
  overlay.html — the scrollr-tv broadcast overlay (docs/SCROLLR_TV.md).

  The real ticker bundle (src/main.tsx → App) in a plain page, built by
  `npm run build:overlay` into dist-overlay/ and served by the scrollr-tv
  server at /overlay/. Unlike embed.html (the website's anonymous bar) it
  is fed by YOUR account: src/overlay/boot.ts routes the app's API calls to
  the server on the same origin, which adds the bearer token. Read boot.ts
  for the query params.
-->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Scrollr overlay</title>
    <script>
      // Pre-paint theme (?theme=<family>-<light|dark>, default scrollr-dark:
      // a broadcast overlay should not follow the capture machine's colour
      // scheme) and background (?bg=transparent|solid, default transparent).
      (function () {
        var p = new URLSearchParams(location.search);
        var q = /^([a-z-]+)-(light|dark)$/.exec(p.get("theme") || "");
        var mode = q ? q[2] : "dark";
        var el = document.documentElement;
        el.setAttribute("data-theme", (q ? q[1] : "scrollr") + "-" + mode);
        el.setAttribute("data-mode", mode);
        el.setAttribute("data-bg", p.get("bg") === "solid" ? "solid" : "transparent");
      })();
    </script>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        width: 100%;
        height: 100%;
        background: transparent;
      }
      html[data-bg="solid"][data-mode="dark"], html[data-bg="solid"][data-mode="dark"] body { background: #141420; }
      html[data-bg="solid"][data-mode="light"], html[data-bg="solid"][data-mode="light"] body { background: #ffffff; }
      /* The app's style.css paints html/body with the theme surface;
         the bar paints its own, so in transparent mode nothing else may. */
      html[data-bg="transparent"], html[data-bg="transparent"] body, html[data-bg="transparent"] #root {
        background: transparent !important;
      }
      #root { width: 100%; height: 100%; }
      .overlay-msg {
        font: 14px/1.5 system-ui, sans-serif;
        color: #e6e6f0;
        background: #141420;
        padding: 12px 16px;
        display: inline-block;
        border-radius: 0 0 8px 0;
      }
      .overlay-msg a { color: #7cf2b4; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/overlay/boot.ts"></script>
  </body>
</html>
